name: Deploy Infrastructure

on:
  workflow_call:
    secrets:
      VAULT_TOKEN:
        required: true
      VAULT_ADDR:
        required: true

env:
  VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
  VAULT_ADDR: ${{ secrets.VAULT_ADDR }}
  ENVIRONMENT: staging
  TRAEFIK_DATA_PATH: /opt/tedsws/traefik

jobs:
  deploy:
    name: Deploy Infrastructure
    runs-on: tedsws-staging
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup environment and directories
        run: |
          # Create .env from Vault and fix paths
          make staging-dotenv-file
          sed -i 's|^AIRFLOW_INFRA_FOLDER=.*|AIRFLOW_INFRA_FOLDER=/opt/tedsws|' .env
          sed -i 's|^SUBDOMAIN=.*|SUBDOMAIN=tedsws-staging.|' .env

          # Set AIRFLOW_UID to match current user so container can write to mounted volumes
          echo "AIRFLOW_UID=$(id -u)" >> .env

          # Setup deployment directory
          sudo mkdir -p /opt/tedsws ${TRAEFIK_DATA_PATH}/letsencrypt
          sudo chown -R $USER:$USER /opt/tedsws ${TRAEFIK_DATA_PATH}
          mkdir -p /opt/tedsws/src /opt/tedsws/logs /opt/tedsws/plugins /opt/tedsws/tests

          # Copy .env to deployment dir (keep in repo root for Makefile targets)
          cp .env /opt/tedsws/.env
          chmod 777 /opt/tedsws/logs /opt/tedsws/plugins /opt/tedsws/.env

      - name: Start Traefik
        run: make start-traefik

      - name: Start MongoDB
        run: make start-mongo

      - name: Start Fuseki
        run: make start-fuseki

      - name: Download libraries (if missing)
        run: |
          echo "Checking for required libraries..."
          [ -f libraries/.rmlmapper/rmlmapper.jar ] || make init-rml-mapper-curl
          [ -f libraries/.limes/limes.jar ] || make init-limes-curl
          [ -f libraries/.saxon/saxon-he-10.9.jar ] || make init-saxon-curl
          echo "Libraries ready:"
          ls -la libraries/
          rsync -a --delete libraries/ /opt/tedsws/libraries/

      - name: Build and start Airflow
        run: |
          cp requirements.txt src/infra/airflow/
          docker build -t meaningfy/airflow src/infra/airflow/
          docker-compose -p ${ENVIRONMENT} --file src/infra/airflow/docker-compose.yaml --env-file .env up -d --force-recreate

      - name: Start MinIO
        run: make start-minio

      # Digest API - disabled, needs Python 3.10+ and build tools fix
      # - name: Start Digest API
      #   run: make create-env-digest-api start-digest_service-api

      - name: Start Metabase
        run: make start-metabase
