name: Deploy TED-SWS Stack

on:
  workflow_dispatch:
  push:
    branches:
      - feature/OPS-16/tedsws-deployment-flow

env:
  VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
  VAULT_ADDR: ${{ secrets.VAULT_ADDR }}
  ENVIRONMENT: staging

jobs:
  deploy:
    name: Deploy TED-SWS Stack
    runs-on: tedsws-staging

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Create environment file from Vault
        run: make staging-dotenv-file

      - name: Start Traefik
        run: make start-traefik

      - name: Start MongoDB
        run: make start-mongo

      - name: Start Fuseki
        run: make start-fuseki

      # Airflow
      - name: Download libraries (if missing)
        run: |
          echo "Checking for required libraries..."
          [ -f libraries/.rmlmapper/rmlmapper.jar ] || make init-rml-mapper-curl
          [ -f libraries/.limes/limes.jar ] || make init-limes-curl
          [ -f libraries/.saxon/saxon-he-10.9.jar ] || make init-saxon-curl
          echo "Libraries ready:"
          ls -la libraries/

      - name: Sync to deployment directory
        run: |
          echo "Syncing files to /opt/tedsws..."
          sudo mkdir -p /opt/tedsws
          sudo chown -R $USER:$USER /opt/tedsws
          mkdir -p /opt/tedsws/src
          rsync -a --delete src/dags/ /opt/tedsws/src/dags/
          rsync -a --delete src/ted_sws/ /opt/tedsws/src/ted_sws/
          rsync -a --delete libraries/ /opt/tedsws/libraries/
          cp .env /opt/tedsws/.env
          mkdir -p /opt/tedsws/logs /opt/tedsws/plugins /opt/tedsws/tests
          echo "Deployment directory contents:"
          ls -la /opt/tedsws/
          ls -la /opt/tedsws/src/

      - name: Build and start Airflow
        env:
          AIRFLOW_INFRA_FOLDER: /opt/tedsws
        run: make build-airflow

      # Remaining services
      - name: Start MinIO
        run: make start-minio

      - name: Start AllegroGraph
        run: make start-allegro-graph

      # Digest API - disabled, needs Python 3.10+ and build tools fix
      # - name: Start Digest API
      #   run: make create-env-digest-api start-digest_service-api

      - name: Start Metabase
        run: make start-metabase

      # Health checks
      - name: Health check - All services
        run: |
          echo "Waiting for all services to stabilize..."
          sleep 30

          failed=0

          echo "=== Checking Traefik ==="
          docker ps | grep -q "traefik" && echo "✓ Traefik" || { echo "✗ Traefik"; failed=1; }

          echo "=== Checking Data Stores ==="
          docker ps | grep -q "mongodb-${ENVIRONMENT}" && echo "✓ MongoDB" || { echo "✗ MongoDB"; failed=1; }
          docker ps | grep -q "fuseki-${ENVIRONMENT}" && echo "✓ Fuseki" || { echo "✗ Fuseki"; failed=1; }
          docker ps | grep -q "minio-${ENVIRONMENT}" && echo "✓ MinIO" || { echo "✗ MinIO"; failed=1; }
          docker ps | grep -q "agraph-${ENVIRONMENT}" && echo "✓ AllegroGraph" || { echo "✗ AllegroGraph"; failed=1; }

          echo "=== Checking Airflow ==="
          docker ps | grep -q "airflow-webserver" && echo "✓ Airflow webserver" || { echo "✗ Airflow webserver"; failed=1; }
          docker ps | grep -q "airflow-scheduler" && echo "✓ Airflow scheduler" || { echo "✗ Airflow scheduler"; failed=1; }
          docker ps | grep -q "airflow-worker" && echo "✓ Airflow worker" || { echo "✗ Airflow worker"; failed=1; }

          echo "=== Checking APIs ==="
          # docker ps | grep -q "digest_service" && echo "✓ Digest API" || { echo "✗ Digest API"; failed=1; }
          docker ps | grep -q "metabase-${ENVIRONMENT}" && echo "✓ Metabase" || { echo "✗ Metabase"; failed=1; }

          echo ""
          echo "=== All containers ==="
          docker ps --format "table {{.Names}}\t{{.Status}}"

          exit $failed
