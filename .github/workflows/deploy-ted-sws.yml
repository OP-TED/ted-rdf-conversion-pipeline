name: Deploy TED-SWS Stack

on:
  workflow_dispatch:
  push:
    branches:
      - feature/OPS-16/tedsws-deployment-flow

env:
  VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
  VAULT_ADDR: ${{ secrets.VAULT_ADDR }}
  ENVIRONMENT: staging

jobs:
  deploy:
    name: Deploy TED-SWS Stack
    runs-on: tedsws-staging

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Create environment file from Vault
        run: make staging-dotenv-file

      - name: Start Traefik
        run: make start-traefik

      - name: Health check - Traefik
        run: |
          echo "Waiting for Traefik to start..."
          sleep 10
          if docker ps | grep -q traefik; then
            echo "✓ Traefik is running"
            docker ps --filter "name=traefik" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
          else
            echo "✗ Traefik is NOT running"
            docker logs traefik 2>&1 | tail -50 || true
            exit 1
          fi

      - name: Start MongoDB
        run: make start-mongo

      - name: Start Fuseki
        run: make start-fuseki

      - name: Health check - Data stores
        run: |
          echo "Waiting for services to start..."
          sleep 15
          echo "Checking MongoDB..."
          if docker ps | grep -q "mongodb-${ENVIRONMENT}"; then
            echo "✓ MongoDB is running"
          else
            echo "✗ MongoDB is NOT running"
            exit 1
          fi
          echo "Checking Fuseki..."
          if docker ps | grep -q "fuseki-${ENVIRONMENT}"; then
            echo "✓ Fuseki is running"
          else
            echo "✗ Fuseki is NOT running"
            exit 1
          fi
          docker ps --format "table {{.Names}}\t{{.Status}}"
