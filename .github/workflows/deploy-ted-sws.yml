name: Deploy TED-SWS Stack

on:
  workflow_dispatch:
  push:
    branches:
      - feature/OPS-16/tedsws-deployment-flow

env:
  VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
  VAULT_ADDR: ${{ secrets.VAULT_ADDR }}
  ENVIRONMENT: staging

jobs:
  deploy:
    name: Deploy TED-SWS Stack
    runs-on: tedsws-staging

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Create environment file from Vault
        run: make staging-dotenv-file

      - name: Start Traefik
        run: make start-traefik

      - name: Health check - Traefik
        run: |
          echo "Waiting for Traefik to start..."
          sleep 10
          if docker ps | grep -q traefik; then
            echo "✓ Traefik is running"
            docker ps --filter "name=traefik" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
          else
            echo "✗ Traefik is NOT running"
            docker logs traefik 2>&1 | tail -50 || true
            exit 1
          fi

      - name: Start MongoDB
        run: make start-mongo

      - name: Start Fuseki
        run: make start-fuseki

      - name: Health check - Data stores
        run: |
          echo "Waiting for services to start..."
          sleep 15
          echo "Checking MongoDB..."
          if docker ps | grep -q "mongodb-${ENVIRONMENT}"; then
            echo "✓ MongoDB is running"
          else
            echo "✗ MongoDB is NOT running"
            exit 1
          fi
          echo "Checking Fuseki..."
          if docker ps | grep -q "fuseki-${ENVIRONMENT}"; then
            echo "✓ Fuseki is running"
          else
            echo "✗ Fuseki is NOT running"
            exit 1
          fi
          docker ps --format "table {{.Names}}\t{{.Status}}"

      # Phase 3: Airflow
      - name: Download libraries (if missing)
        run: |
          echo "Checking for required libraries..."
          [ -f libraries/.rmlmapper/rmlmapper.jar ] || make init-rml-mapper-curl
          [ -f libraries/.limes/limes.jar ] || make init-limes-curl
          [ -f libraries/.saxon/saxon-he-10.9.jar ] || make init-saxon-curl
          echo "Libraries ready:"
          ls -la libraries/

      - name: Sync to deployment directory
        run: |
          echo "Syncing files to /opt/tedsws..."
          sudo mkdir -p /opt/tedsws
          sudo chown -R $USER:$USER /opt/tedsws
          mkdir -p /opt/tedsws/src
          rsync -a --delete src/dags/ /opt/tedsws/src/dags/
          rsync -a --delete src/ted_sws/ /opt/tedsws/src/ted_sws/
          rsync -a --delete libraries/ /opt/tedsws/libraries/
          cp .env /opt/tedsws/.env
          mkdir -p /opt/tedsws/logs /opt/tedsws/plugins /opt/tedsws/tests
          echo "Deployment directory contents:"
          ls -la /opt/tedsws/
          ls -la /opt/tedsws/src/

      - name: Build and start Airflow
        env:
          AIRFLOW_INFRA_FOLDER: /opt/tedsws
        run: make build-airflow

      - name: Health check - Airflow
        run: |
          echo "Waiting for Airflow services to start..."
          sleep 30
          echo "Checking Airflow webserver..."
          if docker ps | grep -q "airflow-webserver"; then
            echo "✓ Airflow webserver is running"
          else
            echo "✗ Airflow webserver is NOT running"
            docker logs airflow-webserver 2>&1 | tail -50 || true
            exit 1
          fi
          echo "Checking Airflow scheduler..."
          if docker ps | grep -q "airflow-scheduler"; then
            echo "✓ Airflow scheduler is running"
          else
            echo "✗ Airflow scheduler is NOT running"
            exit 1
          fi
          docker ps --filter "name=airflow" --format "table {{.Names}}\t{{.Status}}"

      # Phase 4: Remaining services
      - name: Start MinIO
        run: make start-minio

      - name: Start AllegroGraph
        run: make start-allegro-graph

      - name: Start Digest API
        run: make create-env-digest-api start-digest_service-api

      - name: Start Metabase
        run: make start-metabase

      - name: Health check - All services
        run: |
          echo "Waiting for services to start..."
          sleep 15
          echo "Checking MinIO..."
          docker ps | grep -q "minio-${ENVIRONMENT}" && echo "✓ MinIO is running" || echo "✗ MinIO is NOT running"
          echo "Checking AllegroGraph..."
          docker ps | grep -q "agraph-${ENVIRONMENT}" && echo "✓ AllegroGraph is running" || echo "✗ AllegroGraph is NOT running"
          echo "Checking Digest API..."
          docker ps | grep -q "digest_service" && echo "✓ Digest API is running" || echo "✗ Digest API is NOT running"
          echo "Checking Metabase..."
          docker ps | grep -q "metabase-${ENVIRONMENT}" && echo "✓ Metabase is running" || echo "✗ Metabase is NOT running"
          echo ""
          echo "=== All running containers ==="
          docker ps --format "table {{.Names}}\t{{.Status}}"
