name: Test Vault Access

on:
  push:
    branches: [feature/OPS-5/*]

jobs:
  test-vault:
    name: Check Vault Connectivity
    runs-on: ubuntu-latest

    steps:
      - name: Test Vault access
        env:
          VAULT_ADDR: ${{ secrets.VAULT_ADDR }}
        run: |
          echo "Testing connectivity to Vault..."
          curl -s -o /dev/null -w "HTTP Status: %{http_code}\n" "$VAULT_ADDR/v1/sys/health" || echo "Connection failed"
