name: Tests

on:
  push:
    branches: [feature/**, hotfix/**, release/**]
  pull_request:
    branches: [develop, main, release/**]
  workflow_call:
    inputs:
      full_tests:
        description: 'Run full test suite (including integration tests)'
        type: boolean
        default: true
    secrets:
      VAULT_TOKEN:
        required: true
      VAULT_ADDR:
        required: true
      SONAR_TOKEN:
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
  VAULT_ADDR: ${{ secrets.VAULT_ADDR }}
  ENVIRONMENT: staging

jobs:
  test:
    name: ${{ (github.event_name == 'pull_request' || inputs.full_tests) && 'Full Tests' || 'Unit Tests' }}
    runs-on: ${{ (github.event_name == 'pull_request' || inputs.full_tests) && 'tedsws-staging' || 'ubuntu-latest' }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Java
        if: github.event_name == 'pull_request' || inputs.full_tests
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Install Vault
        if: github.event_name == 'pull_request' || inputs.full_tests
        run: |
          if ! command -v vault &> /dev/null; then
            wget -O- https://apt.releases.hashicorp.com/gpg | sudo gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
            echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/hashicorp.list
            sudo apt-get update && sudo apt-get install -y vault
          else
            echo "Vault already installed: $(vault --version)"
          fi

      - name: Install system dependencies
        run: |
          if ! dpkg -s libssl-dev &> /dev/null; then
            sudo apt-get update && sudo apt-get install -y libssl-dev libcurl4-openssl-dev
          else
            echo "System dependencies already installed"
          fi

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade setuptools pip wheel
          make install
          make install-dev

      - name: Resolve Docker container hostnames
        if: github.event_name == 'pull_request' || inputs.full_tests
        run: |
          for container in mongodb-staging fuseki-staging minio-staging sftp-staging; do
            ip=$(docker inspect -f '{{(index .NetworkSettings.Networks "common-ext-staging").IPAddress}}' "$container" 2>/dev/null)
            if [ -n "$ip" ]; then
              echo "$ip $container" | sudo tee -a /etc/hosts
            else
              echo "WARNING: Container $container not found or has no IP on common-ext-staging"
            fi
          done
          echo "=== /etc/hosts entries ==="
          grep -E "staging" /etc/hosts
          echo "=== Connectivity check ==="
          curl -sf --max-time 5 http://fuseki-staging:3030 > /dev/null && echo "OK: fuseki-staging:3030 reachable" || echo "FAIL: fuseki-staging:3030 not reachable"
          curl -sf --max-time 5 http://minio-staging:9000 > /dev/null && echo "OK: minio-staging:9000 reachable" || echo "FAIL: minio-staging:9000 not reachable"
          nc -z -w5 mongodb-staging 27017 && echo "OK: mongodb-staging:27017 reachable" || echo "FAIL: mongodb-staging:27017 not reachable"
          nc -z -w5 sftp-staging 22 && echo "OK: sftp-staging:22 reachable" || echo "FAIL: sftp-staging:22 not reachable"

      - name: Create env file
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ] || [ "${{ inputs.full_tests }}" == "true" ]; then
            make staging-dotenv-file
            # Override Vault values for direct container access (no Traefik/proxy)
            sed -i 's/^SFTP_PUBLISH_PORT=.*/SFTP_PUBLISH_PORT=22/' .env
            sed -i 's/^S3_PUBLISH_SECURE=.*/S3_PUBLISH_SECURE=false/' .env
          else
            echo "VAULT_TOKEN=${{ secrets.VAULT_TOKEN }}" >> .env
            echo "VAULT_ADDR=${{ secrets.VAULT_ADDR }}" >> .env
          fi

      - name: Get Java tools (Saxon, Limes, RML mapper)
        if: github.event_name == 'pull_request' || inputs.full_tests
        run: make init-libraries

      # Using python -m tox instead of make targets to avoid conflict with
      # outdated system tox on self-hosted runner (/home/lps/.local/bin/tox)
      - name: Run tests
        run: ${{ (github.event_name == 'pull_request' || inputs.full_tests) && 'python -m tox' || 'python -m tox -e unit' }}

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Cleanup
        if: always()
        run: |
          echo "=== Cleaning up test artifacts ==="
          rm -rf .tox .pytest_cache __pycache__ .coverage coverage.xml
          find . -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
          find . -type f -name "*.pyc" -delete 2>/dev/null || true
          # Remove Docker container host entries added during this run
          sudo sed -i '/-staging$/d' /etc/hosts
          echo "=== Disk usage ==="
          df -h /
