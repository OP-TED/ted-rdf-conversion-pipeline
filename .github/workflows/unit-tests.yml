name: Tests

on:
  push:
    branches: [feature/**, main, hotfix/**, release/**]
  pull_request:
    branches: [main, release/**]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
  VAULT_ADDR: ${{ secrets.VAULT_ADDR }}
  ENVIRONMENT: staging

jobs:
  test:
    name: ${{ github.event_name == 'pull_request' && 'Full Tests' || 'Unit Tests' }}
    runs-on: ${{ github.event_name == 'pull_request' && 'self-hosted' || 'ubuntu-latest' }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Java
        if: github.event_name == 'pull_request'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Install Vault
        if: github.event_name == 'pull_request'
        run: |
          if ! command -v vault &> /dev/null; then
            wget -O- https://apt.releases.hashicorp.com/gpg | sudo gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
            echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/hashicorp.list
            sudo apt-get update && sudo apt-get install -y vault
          else
            echo "Vault already installed: $(vault --version)"
          fi

      - name: Install system dependencies
        run: |
          if ! dpkg -s libssl-dev &> /dev/null; then
            sudo apt-get update && sudo apt-get install -y libssl-dev libcurl4-openssl-dev
          else
            echo "System dependencies already installed"
          fi

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade setuptools pip wheel
          make install
          make install-dev

      - name: Create env file
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            make staging-dotenv-file
          else
            echo "VAULT_TOKEN=${{ secrets.VAULT_TOKEN }}" >> .env
            echo "VAULT_ADDR=${{ secrets.VAULT_ADDR }}" >> .env
          fi

      - name: Get Java tools (Saxon, Limes, RML mapper)
        if: github.event_name == 'pull_request'
        run: |
          make init-saxon
          make init-limes
          make init-rml-mapper

      # Using python -m tox instead of make targets to avoid conflict with
      # outdated system tox on self-hosted runner (/home/lps/.local/bin/tox)
      - name: Run tests
        run: ${{ github.event_name == 'pull_request' && 'python -m tox' || 'python -m tox -e unit' }}

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
