# =============================================================================
# TED-SWS Stack - Local Development
# Usage: docker compose -f docker-compose.yml -f docker-compose.local.yml --env-file .env.local up -d
# =============================================================================

x-airflow-build: &airflow-build
  context: ./airflow
  dockerfile: Dockerfile

x-airflow-volumes: &airflow-volumes
  - ../../../src:/opt/airflow/src
  - ../../../test:/opt/airflow/test
  - ../../../libraries/.rmlmapper:/home/airflow/.rmlmapper
  - ../../../libraries/.saxon:/home/airflow/.saxon
  - ../../../libraries/.limes:/home/airflow/.limes

services:
  traefik:
    ports:
      - "8080:80"
    environment:
      TRAEFIK_API_INSECURE: "true"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard.rule=Host(`traefik.localhost`)"
      - "traefik.http.routers.dashboard.service=api@internal"

  minio:
    ports:
      - "9001:9001"
    volumes:
      - minio-data:/data
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.minio.rule=Host(`minio.localhost`)"
      - "traefik.http.services.minio.loadbalancer.server.port=9001"

  mongodb:
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db

  mongo-express:
    ports:
      - "8082:8081"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mongo-express.rule=Host(`mongo.localhost`)"

  fuseki:
    ports:
      - "3030:3030"
    volumes:
      - fuseki-data:/fuseki-base/databases
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.fuseki.rule=Host(`fuseki.localhost`)"
      - "traefik.http.services.fuseki.loadbalancer.server.port=3030"

  metabase:
    ports:
      - "3000:3000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.metabase.rule=Host(`metabase.localhost`)"
      - "traefik.http.services.metabase.loadbalancer.server.port=3000"

  sftp:
    ports:
      - "2235:22"
    volumes:
      - sftp-data:/home
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sftp.rule=Host(`sftp.localhost`)"

  airflow-postgres:
    volumes:
      - airflow-postgres-data:/var/lib/postgresql/data

  airflow-init:
    build: *airflow-build
    volumes: *airflow-volumes
    env_file:
      - .env.common
      - .env.local

  airflow-webserver:
    build: *airflow-build
    ports:
      - "8081:8080"
    volumes: *airflow-volumes
    env_file:
      - .env.common
      - .env.local
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.airflow.rule=Host(`airflow.localhost`)"
      - "traefik.http.services.airflow.loadbalancer.server.port=8080"

  airflow-scheduler:
    build: *airflow-build
    volumes: *airflow-volumes
    env_file:
      - .env.common
      - .env.local

  airflow-worker:
    build: *airflow-build
    volumes: *airflow-volumes
    env_file:
      - .env.common
      - .env.local

  airflow-triggerer:
    build: *airflow-build
    volumes: *airflow-volumes
    env_file:
      - .env.common
      - .env.local

volumes:
  minio-data:
  mongodb-data:
  fuseki-data:
  sftp-data:
  airflow-postgres-data:
